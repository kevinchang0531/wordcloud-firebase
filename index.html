<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字雲投稿</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      text-align: center;
    }

    .icon { font-size: 56px; margin-bottom: 16px; }

    h1 {
      font-size: 28px;
      color: #2d3748;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #718096;
      font-size: 15px;
      margin-bottom: 36px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      font-size: 18px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
      color: #2d3748;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: #667eea;
    }

    input[type="text"]::placeholder {
      color: #a0aec0;
    }

    .hint {
      font-size: 13px;
      color: #a0aec0;
      margin: 8px 0 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .success {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #f0fff4;
      border: 2px solid #9ae6b4;
      border-radius: 12px;
      color: #276749;
      font-size: 15px;
    }

    .error {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #fff5f5;
      border: 2px solid #feb2b2;
      border-radius: 12px;
      color: #9b2c2c;
      font-size: 15px;
    }

    .counter {
      margin-top: 24px;
      font-size: 13px;
      color: #a0aec0;
    }

    .counter span {
      color: #667eea;
      font-weight: 600;
    }

    .view-link {
      display: inline-block;
      margin-top: 20px;
      color: #667eea;
      font-size: 14px;
      text-decoration: none;
    }
    .view-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💬</div>
    <h1>分享你的關鍵字</h1>
    <p class="subtitle">輸入一個詞，讓大家看見你的想法</p>

    <input type="text" id="wordInput" placeholder="輸入關鍵字…" maxlength="20" autocomplete="off">
    <p class="hint">最多 20 個字，每人限投一次</p>

    <button id="submitBtn" onclick="submitWord()">送出 ✨</button>

    <div class="success" id="successMsg">✅ 送出成功！你的關鍵字已加入文字雲</div>
    <div class="error" id="errorMsg"></div>

    <div class="counter">目前共 <span id="totalCount">0</span> 筆回應</div>
    <a href="cloud.html" class="view-link">👀 查看即時文字雲 →</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBtyW0pm5uoTPXdNtButsbNApmIL3uuUgQ",
      authDomain: "fir-test-4f91d.firebaseapp.com",
      projectId: "fir-test-4f91d",
      storageBucket: "fir-test-4f91d.firebasestorage.app",
      messagingSenderId: "794618146191",
      appId: "1:794618146191:web:dc18e1abaf910862ebeffa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const col = collection(db, "wordcloud_words");

    // 即時計數
    onSnapshot(col, (snap) => {
      document.getElementById("totalCount").textContent = snap.size;
    });

    // 防重複投票（localStorage）
    const SUBMITTED_KEY = "wordcloud_submitted";

    window.submitWord = async function() {
      const input = document.getElementById("wordInput");
      const word = input.value.trim();
      const btn = document.getElementById("submitBtn");
      const successMsg = document.getElementById("successMsg");
      const errorMsg = document.getElementById("errorMsg");

      successMsg.style.display = "none";
      errorMsg.style.display = "none";

      if (!word) {
        errorMsg.textContent = "⚠️ 請先輸入關鍵字";
        errorMsg.style.display = "block";
        return;
      }

      if (localStorage.getItem(SUBMITTED_KEY)) {
        errorMsg.textContent = "⚠️ 你已經投過了！每人限投一次";
        errorMsg.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "送出中…";

      try {
        await addDoc(col, {
          word: word,
          created_at: serverTimestamp()
        });
        localStorage.setItem(SUBMITTED_KEY, "1");
        input.value = "";
        successMsg.style.display = "block";
        btn.textContent = "已送出 ✅";
      } catch (e) {
        btn.disabled = false;
        btn.textContent = "送出 ✨";
        errorMsg.textContent = "❌ 送出失敗：" + e.message;
        errorMsg.style.display = "block";
      }
    };

    // Enter 鍵送出
    document.getElementById("wordInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") window.submitWord();
    });
  </script>
</body>
</html>
